<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clearing Navigation Cache...</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f0f4f8;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h2 { color: #1d2327; }
        p { color: #666; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #F7610C;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h2>Clearing Navigation Cache...</h2>
        <p id="msg">Please wait...</p>
    </div>
    <script>
        try {
            localStorage.removeItem('inclen_nav_menu_structure');
            document.getElementById('msg').textContent = '✅ Cache cleared! Redirecting to homepage...';
        } catch(e) {
            document.getElementById('msg').textContent = 'Error: ' + e.message;
        }
        setTimeout(() => {
            window.location.href = '/';
        }, 1500);
    </script>
</body>
</html>
